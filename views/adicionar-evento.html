<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Eventos</title>
    <link rel="stylesheet" href="style/adicionar-evento.css">
</head>

<body>

    <header>
        <h1>Gerenciar Eventos</h1>
        <button id="btnNovoEvento">+ Novo Evento</button>
    </header>

    <main>
        <section class="eventos-container">
            <h2>Eventos cadastrados</h2>

            <div id="listaEventos">
                <!-- Os eventos serão colocados aqui pelo JavaScript -->
            </div>
        </section>
    </main>

    <div id="modal" class="modal">

        <div class="modal-content">

            <div class="modal-header">
                <h2 id="tituloModal">Novo Evento</h2>
                <button id="btnFecharModal">&times;</button>
            </div>

            <form id="formEvento">

                <input type="hidden" id="eventoId">

                <h3 class="titulo-secao">Dados do evento</h3>

                <div class="campo">
                    <label for="nome_evento">Nome do evento</label>
                    <input type="text" id="nome_evento" required>
                </div>

                <div class="campo">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" required></textarea>
                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="data">Data</label>
                        <input type="date" id="data" required>
                    </div>

                    <div class="campo">
                        <label for="hora_inicio">Hora de início</label>
                        <input type="time" id="hora_inicio" required>
                    </div>

                    <div class="campo">
                        <label for="hora_fim">Hora de término</label>
                        <input type="time" id="hora_fim" required>
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="logradouro">Logradouro</label>
                        <input type="text" id="logradouro" required>
                    </div>

                    <div class="campo pequeno">
                        <label for="numero_local">Número</label>
                        <input type="number" id="numero_local" min="1" required>
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" required>
                    </div>

                    <div class="campo">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" required>
                    </div>

                </div>

                <div class="linha">

                    <div class="campo">
                        <label for="capacidade">Capacidade</label>
                        <input type="number" id="capacidade" min="1" required>
                    </div>

                    <div class="campo">
                        <label for="classificacao_etaria">Classificação etária</label>
                        <input type="number" id="classificacao_etaria" min="0" required>
                    </div>

                </div>

                <div class="campo">
                    <label for="destaque_evento">Destaque do evento</label>
                    <input type="text" id="destaque_evento" maxlength="200" required>
                </div>

                <div class="campo">
                    <label for="imagem">URL da imagem</label>
                    <input type="url" id="imagem">
                </div>

                <div class="campo">
                    <label for="link_compra">Link para compra</label>
                    <input type="url" id="link_compra" required>
                </div>


                <div class="secao-relacionamento">

                    <h3 class="titulo-secao">Categorias</h3>

                    <p class="descricao-secao">
                        Selecione as categorias do evento.
                    </p>

                    <div id="listaCategorias" class="lista-opcoes"></div>

                </div>


                <div class="secao-relacionamento">
                
                    <div class="titulo-ingressos">
                
                        <div>
                            <h3 class="titulo-secao">Artistas</h3>
                
                            <p class="descricao-secao">
                                Adicione os artistas que participarão do evento.
                            </p>
                        </div>
                
                        <button type="button" id="btnAdicionarArtista" class="btn-adicionar">
                            + Adicionar artista
                        </button>
                
                    </div>
                
                    <div id="listaArtistas"></div>
                
                </div>


                <div class="secao-relacionamento">

                    <div class="titulo-ingressos">

                        <div>
                            <h3 class="titulo-secao">Ingressos</h3>

                            <p class="descricao-secao">
                                Adicione os ingressos disponíveis para o evento.
                            </p>
                        </div>

                        <button
                            type="button"
                            id="btnAdicionarIngresso"
                            class="btn-adicionar"
                        >
                            + Adicionar ingresso
                        </button>

                    </div>

                    <div id="listaIngressos"></div>

                </div>


                <div class="botoes-form">

                    <button
                        type="button"
                        id="btnCancelar"
                        class="btn-cancelar"
                    >
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="btn-salvar"
                    >
                        Salvar Evento
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="/javascript/adicionar-evento.js"></script>

</body>
</html>
