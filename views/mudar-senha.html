<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha</title>
    <link rel="stylesheet" href="style/mudar-senha.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="img/icone-logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=lock" />
</head>
<body>
    <header>
        <a href="inserir-token.html"><i class="bi-arrow-left-circle-fill"></i></a>
    </header>
    <main>
        <div class="box">
            <img src="img/logo.png" alt="Logo Explora+">
            <img src="img/progresso-cadastri3.png" alt="" width="170px">
            <h1>Insira uma nova senha</h1>
            <form action="#" method="post" id="formNovaSenha">
                <div class="barra_input">
                    <span class="material-symbols-outlined">lock</span>
                    <input type="password" name="senha_nova" id="senha_nova" placeholder="Senha Nova" minlength="6">
                </div>
                <div class="barra_input">
                    <span class="material-symbols-outlined">lock</span>
                    <input type="password" name="confirmar_senha_nova" id="confirmar_senha_nova" placeholder="Confirmar senha nova" minlength="6">
                </div>
                <p id="mensagemSenha" style="display:none;"></p>
                <button class="btn-preferencia" id="concluirTroca">
                Concluir
                
                </button>
            </form>
        </div>
    </main>
    
</body>]
<script src="/javascript/mudar-senha.js"></script>
</html>
