<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    
    <link rel="stylesheet" href="style/login.css">
    <link rel="stylesheet" href="style/footer.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="img/icone-logo.png" type="image/x-icon">
</head>
<body>
    <header>
        <a href="index.html"><i class="bi-arrow-left-circle-fill"></i></a>
        <img src="img/logo.png" alt="Logo Explora+">
    </header>
    <main>
        <section class="caixa-geral">
            <div class="box-login">
                <h1>Bem-vindo de volta</h1>
                <p>Se conecte com a sua conta</p>
                <div class="inserir-dados">
                    <form action="#">
                        <div class="barra_input">
                            <span class="material-symbols-outlined">mail</span>
                            <input type="email" name="email" id="email" placeholder="E-mail" required>
                        </div>
                        <div class="barra_input">
                            <span class="material-symbols-outlined">lock</span>
                            <input type="password" name="senha" id="senha" placeholder="Senha Nova" minlength="6" required>
                        </div>
                        <div class="cadastro-responsivo">
                        <a href="esqueceu-senha.html">Esqueci a senha</a>
                        <a href="cadastro.html">Cadastre-se</a>
                    </div>
                        <button type="submit" class="btn-preferencia" id="btn-login">Login</button>
                    </form>
                    
                </div>
                
                <div class="logar-plataformas">
                    <a href=""><i class="bi bi-facebook"></i></a>
                    <a href=""><i class="bi bi-google"></i></a>
                    <a href=""><i class="bi bi-linkedin"></i></a>
                </div>
            </div>
            <div class="box-verde">
                <h1>Não tem uma conta?</h1>
                <p>Crie sua conta e tenha acesso a todos os recursos da plataforma.</p>
                <a href="cadastro.html" class="btn-preferencia">Cadastre-Se</a>
            </div>
        </section>
        
    </main>
    <footer>
        <div class="coluna-footer">
            <div class="coluna-explora">
                <h1>Explora+</h1>
                <p>Descubra os melhores eventos da sua cidade
                    e planeje viagens inesquecíveis.</p>
            </div>
        </div>
        <div class="coluna-footer">
            <h1>Redes Sociais</h1>
            <div class="links-redes">
                <a href=""><i class="bi bi-instagram"></i></a>
                <a href=""><i class="bi bi-facebook"></i></a>
                <a href="mailto:exploramais.eventos@gmail.com"><i class="bi bi-envelope-fill"></i></a>
            </div>
        </div>
    </footer>
</body>
<script src="/javascript/login.js"></script>
</html>
